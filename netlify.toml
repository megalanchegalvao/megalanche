[build]
  command = "cd artifacts/cookies-and-cookies && pnpm run build"
  publish = "artifacts/cookies-and-cookies/dist/public"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_DRAWER = "false"
  NETLIFY_DISABLE_DRAWER = "true"

[context.deploy-preview.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_DISABLE_DRAWER = "true"

[context.production.environment]
  NETLIFY_DRAWER = "false"
  NETLIFY_DISABLE_DRAWER = "true"
