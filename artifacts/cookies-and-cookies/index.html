<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Mega Lanche Galvão | Cardápio Digital & Delivery</title>
    <meta name="description" content="Cardápio digital oficial do Mega Lanche Galvão. As famosas Barcas com lanches e batata recheada, hambúrgueres artesanais, pastéis crocantes e bebidas geladas. Disk Delivery e Retirada no Local." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Mega Lanche Galvão | Sabor que faz a diferença!" />
    <meta property="og:description" content="Barcas com lanches, X-Burgers, pastéis e refrigerantes. Faça seu pedido online com entrega rápida ou retirada!" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/images/mega/logo-banner.jpg" />
    <link rel="icon" type="image/jpeg" href="/images/mega/logo-banner.jpg" />
    <link rel="apple-touch-icon" href="/images/mega/logo-banner.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* Bloqueio definitivo do selo e balão Netlify */
      [href*="netlify.com"],
      [href*="netlify.app"],
      [class*="netlify" i],
      [id*="netlify" i],
      netlify-drawer,
      #netlify-drawer,
      .netlify-badge,
      [data-netlify-badge],
      iframe[src*="netlify"],
      iframe[id*="netlify"],
      iframe[title*="Netlify"],
      div:has(> a[href*="netlify.com"]),
      div:has(> [class*="netlify" i]) {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -99999px !important;
        top: -99999px !important;
        width: 0 !important;
        height: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: inset(100%) !important;
        z-index: -999999 !important;
      }
    </style>
  </head>
  <body class="bg-[#F1F3F6] text-[#1E293B] antialiased selection:bg-[#DC2626] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        function exterminateNetlify() {
          try {
            // 1. Remover por seletores conhecidos
            var targets = document.querySelectorAll(
              'netlify-drawer, [data-netlify-drawer], #netlify-drawer, iframe[id*="netlify"], .netlify-feedback-badge, .netlify-badge, [data-netlify-badge], a[href*="netlify.com"], a[href*="netlify.app"], [class*="netlify" i]'
            );
            for (var i = 0; i < targets.length; i++) {
              var el = targets[i];
              if (el && el.parentNode) {
                el.parentNode.removeChild(el);
              }
            }

            // 2. Procurar qualquer elemento com texto "Powered by Netlify"
            var all = document.querySelectorAll('div, a, span, button, p');
            for (var j = 0; j < all.length; j++) {
              var item = all[j];
              var txt = item.textContent || item.innerText || '';
              if (txt.indexOf('Powered by Netlify') !== -1) {
                var container = item.closest('div[style*="position: fixed"], [style*="position: fixed"], a') || item;
                if (container && container.parentNode) {
                  container.parentNode.removeChild(container);
                } else {
                  item.style.display = 'none';
                }
              }
            }
          } catch(e) {}
        }

        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(exterminateNetlify).observe(document.documentElement, { childList: true, subtree: true });
        }
        setInterval(exterminateNetlify, 100);
        window.addEventListener('DOMContentLoaded', exterminateNetlify);
        window.addEventListener('load', exterminateNetlify);
        exterminateNetlify();
      })();
    </script>
  </body>
</html>
