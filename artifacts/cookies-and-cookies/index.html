  <body class="bg-[#F1F3F6] text-[#1E293B] antialiased selection:bg-[#DC2626] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remover qualquer balão ou drawer de feedback injetado pela Netlify
      (function() {
        var hideNetlify = function() {
          var bad = document.querySelectorAll('netlify-drawer, [data-netlify-drawer], #netlify-drawer, iframe[id*="netlify"], .netlify-feedback-badge');
          bad.forEach(function(el) { if (el && el.parentNode) el.parentNode.removeChild(el); });
        };
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(hideNetlify).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', hideNetlify);
        window.addEventListener('load', hideNetlify);
      })();
    </script>
  </body>
</html>
